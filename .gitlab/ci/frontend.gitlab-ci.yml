include:
  - local: .gitlab/ci/frontend/test-base.gitlab-ci.yml

.with-fixtures-needs:
  needs:
    - "rspec-all frontend_fixture"
    - "rspec-all frontend_fixture clickhouse"

.with-graphql-schema-dump-needs:
  needs:
    - "graphql-schema-dump"

.compile-assets-base:
  extends:
    - .default-retry
    - .default-before_script
    - .assets-compile-cache
    - .with-ci-node-image
  variables:
    SETUP_DB: "false"
    USE_BUNDLE_INSTALL: "false"  # skip bundle install from default prepare_build script
    # Disable warnings in browserslist which can break on backports
    # https://github.com/browserslist/browserslist/blob/a287ec6/node.js#L367-L384
    BROWSERSLIST_IGNORE_OLD_DATA: "true"
    WEBPACK_COMPILE_LOG_PATH: "tmp/webpack-output.log"
  stage: prepare
  needs:
    - cache:assets-hash
  script:
    - otel_span --kind build -- scripts/compile_assets
    - otel_span --kind build -- scripts/build_assets_image

compile-production-assets:
  image: ${REGISTRY_HOST}/${REGISTRY_GROUP}/gitlab-build-images/ci/${BUILD_OS}-${OS_VERSION}-slim-ruby-${RUBY_VERSION}-node-${NODE_VERSION}:rubygems-${RUBYGEMS_VERSION}-git-${GIT_VERSION}-lfs-${LFS_VERSION}-yarn-${YARN_VERSION}-graphicsmagick-${GRAPHICSMAGICK_VERSION}-docker-${DOCKER_VERSION}
  extends:
    - .use-buildx
    - .compile-assets-base
    - .production
    - .frontend:rules:compile-production-assets
  tags:
    - $GLCI_PRODUCTION_ASSETS_RUNNER_OPTIONAL
  variables:
    # `build-assets-image` builds the image. This job emits the assets tag/hash
    # artifacts that downstream (Omnibus, CNG, release-environments) consume.
    GLCI_BUILD_ASSETS_IMAGE: "false"
    GLCI_ASSETS_TAG_ENV_FILE_PATH: "assets-tag-env.env"
    ARCH: linux/amd64,linux/arm64
    HEALTHCHECK_TCP_PORT: "2375"
  before_script:
    - !reference [.compile-assets-base, before_script]
    - !reference [.buildx-setup, before_script]
  after_script:
    - source scripts/utils.sh
    - echo "GLCI_ASSETS_IMAGE_TAG=$(assets_image_tag)" > $GLCI_ASSETS_TAG_ENV_FILE_PATH
  artifacts:
    name: webpack-report
    expire_in: 31d
    paths:
      # These assets are used in:
      # - GitLab UI for integration tests: https://gitlab.com/gitlab-org/gitlab-ui/-/blob/e88493b3c855aea30bf60baee692a64606b0eb1e/.storybook/preview-head.pug#L1
      - public/assets/
      - ${WEBPACK_COMPILE_LOG_PATH}
      - ${GLCI_GITLAB_ASSETS_HASH_FILE}
    when: always
    reports:
      dotenv: $GLCI_ASSETS_TAG_ENV_FILE_PATH

compile-production-assets as-if-foss:
  extends:
    - compile-production-assets
    - .as-if-foss
    - .qa:rules:test-on-omnibus-ce:follow-up

compile-production-assets istanbul:
  extends:
    - compile-production-assets
    - .frontend:rules:compile-production-assets-istanbul
  variables:
    BABEL_ENV: "istanbul"
    GLCI_ASSETS_TAG_ENV_FILE_PATH: "assets-tag-env-istanbul.env"
    # compile-production-assets no longer builds an image (build-assets-image does), but the
    # istanbul job still builds its own instrumented image, so re-enable it here.
    GLCI_BUILD_ASSETS_IMAGE: "true"
    GLCI_ASSETS_IMAGE_LAYOUT: "rspack-istanbul"
    # Instrumented code is much bigger, so a default build exhausts the pod
    FE_SOURCEMAPS: "false"
    FE_COMPRESSION: "false"
    FE_MINIFY: "false"
  # The assets caches are shared with plain jobs, so instrumented output stays out
  cache:
    - !reference [.ruby-gems-cache]
    - !reference [.node-modules-cache]
  after_script:
    - source scripts/utils.sh
    - echo "GLCI_ISTANBUL_ASSETS_IMAGE_TAG=$(assets_image_tag)" > $GLCI_ASSETS_TAG_ENV_FILE_PATH
  # Only the image consumes these assets, and instrumented ones are huge
  artifacts:
    name: instrumented-assets
    expire_in: 7d
    when: always
    paths:
      - ${WEBPACK_COMPILE_LOG_PATH}
    reports:
      dotenv: $GLCI_ASSETS_TAG_ENV_FILE_PATH

compile-production-assets vue3:
  extends:
    - .compile-assets-base
    - .production
    - .vue3
    - .frontend:rules:compile-production-assets
  tags:
    - $GLCI_PRODUCTION_ASSETS_RUNNER_OPTIONAL
  artifacts:
    name: webpack-report-vue3
    expire_in: 7d
    when: always
    paths:
      - ${WEBPACK_COMPILE_LOG_PATH}

compile-test-assets:
  extends:
    - .compile-assets-base
    - .frontend:rules:compile-test-assets
  tags:
    - $GITLAB_LARGE_RUNNER_OPTIONAL
  artifacts:
    expire_in: 7d
    paths:
      - public/assets/
      - config/helpers/tailwind/  # Assets created during tailwind compilation
      - "${WEBPACK_COMPILE_LOG_PATH}"
    when: always

compile-test-assets vue3:
  extends:
    - compile-test-assets
    - .vue3

.frontend-fixtures-base:
  extends:
    - .default-retry
    - .default-before_script
    - .base-script
    - .ruby-cache
    - .repo-from-artifacts
  stage: fixtures
  needs:
    - setup-test-env
    - retrieve-tests-metadata
    - compile-test-assets
    # it's ok to wait for the repo artifact as we're waiting for setup-test-env (which takes longer than clone-gitlab-repo) anyway
    - !reference [.repo-from-artifacts, needs]
  artifacts:
    name: frontend-fixtures
    expire_in: 31d
    when: always
    paths:
      - crystalball/
      - knapsack/
      - log/*.log
      - tmp/tests/frontend/**/*

# Builds FOSS, and EE fixtures in the EE project.
# Builds FOSS fixtures in the FOSS project.
rspec-all frontend_fixture:
  extends:
    - .use-pg17
    - .frontend-fixtures-base
    - .frontend:rules:frontend_fixture
  script:
    - !reference [.frontend-fixtures-base, script]
    - rspec_parallelized_job "--tag ~click_house"
  parallel: 8

rspec-all frontend_fixture clickhouse:
  extends:
    - .use-pg17-clickhouse25
    - .frontend-fixtures-base
    - .frontend:rules:frontend_fixture
  variables:
    RSPEC_DRY_RUN_TAGS: "click_house"
  script:
    - !reference [.clickhouse-setup, script]
    - rspec_parallelized_job "--tag click_house"

.upload-frontend-fixtures-base:
  extends:
    - .default-retry
    - .with-ruby-slim-image
  stage: fixtures
  needs:
    - !reference [.with-fixtures-needs, needs]
  script:
    - source scripts/gitlab_component_helpers.sh
    - |
      fixtures_archive_doesnt_exist || { echo "Exiting early as package exists!"; exit 0; }
      create_fixtures_package
      upload_fixtures_package

# Uploads fixtures to package registry if running in canonical project
upload-frontend-fixtures:
  extends:
    - .upload-frontend-fixtures-base
    - .frontend:rules:update-frontend-fixtures

# Same as upload-frontend-fixtures, but triggered manually so fixtures from an
# unmerged branch/pipeline can be published on demand (e.g. to develop an MFE
# against a monolith change before it merges).
upload-frontend-fixtures-on-demand:
  extends:
    - .upload-frontend-fixtures-base
    - .frontend:rules:update-frontend-fixtures-on-demand
  # This job can run on pipelines where the fixture jobs are absent (e.g. MRs
  # targeting a stable branch), so its needs must be optional.
  needs:
    - job: "rspec-all frontend_fixture"
      optional: true
    - job: "rspec-all frontend_fixture clickhouse"
      optional: true

# Cleans up older fixtures packages
cleanup-frontend-fixtures:
  extends:
    - .default-retry
    - .with-ruby-slim-image
    - .frontend:rules:fixtures-packages-cleanup
  stage: fixtures
  # The script only calls the GitLab API and needs no artifacts. Downloading
  # them pulls colliding compile-{test,production}-assets outputs that fail
  # extraction with a file-vs-directory conflict. See:
  # https://gitlab.com/gitlab-org/quality/engineering-productivity/master-broken-incidents/-/issues/30834
  dependencies: []
  before_script:
    - source scripts/utils.sh
    - install_gitlab_gem
  script:
    - scripts/packages/automated_cleanup.rb

graphql-schema-dump:
  variables:
    SETUP_DB: "false"
  extends:
    - .default-retry
    - .ruby-cache
    - .default-before_script
    - .frontend:rules:default-frontend-jobs
  stage: fixtures
  needs:
    - job: cache:ruby-gems
      optional: true
  script:
    - bundle exec rake gitlab:graphql:schema:dump
  artifacts:
    expire_in: 30 days
    name: graphql-schema
    paths:
      - tmp/tests/graphql/gitlab_schema.graphql
      - tmp/tests/graphql/gitlab_schema.json

upload-graphql-schema-dump:
  stage: fixtures
  variables:
    SETUP_DB: "false"
  extends:
    - .default-retry
    - .ruby-cache
    - .default-before_script
    - .frontend:rules:upload-graphql-schema-dump
    - .with-graphql-schema-dump-needs
  script:
    - source scripts/gitlab_component_helpers.sh
    - create_and_upload_graphql_schema_package

jest-build-cache:
  extends:
    - .frontend-test-base
    - .repo-from-artifacts
    - .frontend:rules:jest
  needs:
    - !reference [.frontend-test-base, needs]
    - !reference [.repo-from-artifacts, needs]
  artifacts:
    name: jest-cache
    expire_in: 12h
    when: always
    paths:
      - tmp/cache/jest/
  script:
    - otel_span --kind build -- scripts/frontend/warm_jest_cache.mjs
  variables:
    # Propagate exit code correctly. See https://gitlab.com/groups/gitlab-org/-/epics/6074.
    FF_USE_NEW_BASH_EVAL_STRATEGY: 'true'
    FORCE_COLOR: '1'
    # skip reporting metrics from no-op tests
    GLCI_EXPORT_TEST_METRICS: "false"
  allow_failure:
    # In merge requests, failures exit with 2, so fail the pipeline. Otherwise,
    # they exit with 1, so as not to break master and other pipelines.
    exit_codes: 1

.vue3:
  variables:
    VUE_VERSION: 3
    VUE_COMPILER_VERSION: 3

.with-jest-build-cache-vue3-ensure-compilable-sfcs-needs:
  needs:
    - job: jest-build-cache-vue3-ensure-compilable-sfcs
      optional: true

jest-build-cache-vue3-ensure-compilable-sfcs:
  extends:
    - .vue3
    - jest-build-cache
    - .frontend:rules:jest

jest:
  extends:
    - .frontend-test-base
    - .repo-from-artifacts
    - .frontend:rules:jest
  needs:
    - !reference [.frontend-test-base, needs]
    - !reference [.repo-from-artifacts, needs]
    - job: jest-build-cache
      optional: true
  artifacts:
    name: coverage-frontend
    expire_in: 31d
    when: always
    paths:
      - coverage-frontend/
      - junit_jest.xml
      - jest-reports/
      - jest-test-mapping/
      - tmp/tests/frontend/
    reports:
      junit: junit_jest.xml
  parallel: 11
  script:
    - otel_span --kind test -- scripts/frontend/jest_ci.js

jest-with-fixtures:
  extends:
    - jest
    - .repo-from-artifacts
    - .frontend:rules:jest
  needs:
    - !reference [jest, needs]
    - !reference [.with-fixtures-needs, needs]
  parallel: 2
  script:
    - otel_span --kind test -- scripts/frontend/jest_ci.js --fixtures

jest vue3:
  extends:
    - .frontend-test-base
    - .repo-from-artifacts
    - .frontend:rules:jest
    - .vue3
  needs:
    - !reference [.frontend-test-base, needs]
    - !reference [.repo-from-artifacts, needs]
    - !reference [.with-jest-build-cache-vue3-ensure-compilable-sfcs-needs, needs]
  variables:
    GLCI_TEST_METRICS_RUN_TYPE: frontend-jest-tests-vue3
  artifacts:
    name: vue3-mr-junit
    expire_in: 31d
    when: always
    paths:
      - junit_jest.xml
      - jest-reports/
  parallel: !reference [jest, parallel]
  script:
    - otel_span --kind test -- scripts/frontend/jest_ci.js --vue3

jest-with-fixtures vue3:
  extends:
    - jest vue3
    - .repo-from-artifacts
  needs:
    - !reference [.frontend-test-base, needs]
    - !reference [.with-jest-build-cache-vue3-ensure-compilable-sfcs-needs, needs]
    # it's ok to wait for the repo artifact as we're waiting for the fixtures (which wait for the repo artifact) anyway
    - !reference [.repo-from-artifacts, needs]
    - !reference [.with-fixtures-needs, needs]
  artifacts:
    name: vue3-mr-junit
    expire_in: 31d
    when: always
    paths:
      - junit_jest.xml
      - jest-reports/
  parallel: !reference [jest-with-fixtures, parallel]
  script:
    - otel_span --kind test -- scripts/frontend/jest_ci.js --vue3 --fixtures

jest predictive:
  extends:
    - jest
    - .frontend:rules:jest:predictive
  needs:
    - !reference [jest, needs]
    - "detect-tests"
  script:
    - |
      if [[ -s "$GLCI_PREDICTIVE_CHANGED_FILES_PATH" ]] || [[ -s "$GLCI_PREDICTIVE_MATCHING_JS_FILES_PATH" ]]; then
        otel_span --kind test -- scripts/frontend/jest_ci.js --predictive
      fi

  parallel: 4

jest-with-fixtures predictive:
  extends:
    - jest-with-fixtures
    - .frontend:rules:jest:predictive
  needs:
    - !reference [jest-with-fixtures, needs]
    - "detect-tests"
  script:
    - |
      if [[ -s "$GLCI_PREDICTIVE_CHANGED_FILES_PATH" ]] || [[ -s "$GLCI_PREDICTIVE_MATCHING_JS_FILES_PATH" ]]; then
        otel_span --kind test -- scripts/frontend/jest_ci.js --predictive --fixtures
      fi

jest vue3 predictive:
  extends:
    - jest vue3
    - .frontend:rules:jest:predictive
  needs:
    - !reference [jest vue3, needs]
    - "detect-tests"
  script:
    - |
      if [[ -s "$GLCI_PREDICTIVE_CHANGED_FILES_PATH" ]] || [[ -s "$GLCI_PREDICTIVE_MATCHING_JS_FILES_PATH" ]]; then
        otel_span --kind test -- scripts/frontend/jest_ci.js --vue3 --predictive
      fi
  parallel: !reference [jest predictive, parallel]

jest-with-fixtures vue3 predictive:
  extends:
    - jest-with-fixtures vue3
    - .frontend:rules:jest:predictive
  needs:
    - !reference [jest-with-fixtures vue3, needs]
    - "detect-tests"
  script:
    - |
      if [[ -s "$GLCI_PREDICTIVE_CHANGED_FILES_PATH" ]] || [[ -s "$GLCI_PREDICTIVE_MATCHING_JS_FILES_PATH" ]]; then
        otel_span --kind test -- scripts/frontend/jest_ci.js --vue3 --predictive --fixtures;
      fi
  parallel: !reference [jest-with-fixtures predictive, parallel]

# Frontend integration tests (Jest, backed by Mock Service Worker)
# Posts the MR summary comment and re-raises the Jest exit code captured in JEST_EXIT.
# This runs in `script` instead of `after_script` on purpose.
# We want the budget gate to be able to fail the job when someone adds too many new tests.
# That only works from `script`, because GitLab ignores the exit code of `after_script` and a failure there
# wouldn't stop the pipeline.
#
# Posting the summary comment is best-effort: if the API call fails, the script quietly ignores it
# and the job keeps going. The job fails when tests fail or when the per-new-test budget is breached.
.jest-integration-summary-script:
  script:
    - |
      # Read the recorded integration-test start timestamp; fall back to 0 if the file is
      # missing or unreadable (keeps later duration math from breaking).
      START=$(cat "${JEST_INTEGRATION_START_TIME_FILE}" 2>/dev/null || echo 0)
      DURATION=$(( $(date +%s) - START ))
      node scripts/frontend/post_integration_test_summary.mjs \
        --job-name "${JEST_INTEGRATION_SUMMARY_JOB_NAME}" \
        --report-path "${JEST_INTEGRATION_REPORT}" \
        --artifact-path "${JEST_INTEGRATION_REPORT}" \
        --slow-waits-path "${JEST_INTEGRATION_SLOW_WAITS_FILE}" \
        --job-url "${CI_JOB_URL}" \
        --duration "${DURATION}"
      echo "Exiting with jest exit code $JEST_EXIT."
      exit $JEST_EXIT

jest-integration:
  extends:
    - .frontend-test-base
    - .repo-from-artifacts
    - .frontend:rules:jest-integration
  variables:
    JEST_INTEGRATION_REPORT: tmp/jest-integration-report.json
    JEST_INTEGRATION_START_TIME_FILE: tmp/jest-integration-start-time
    # Job whose master artifact is the summary's baseline; the predictive jobs point at the full job.
    JEST_INTEGRATION_SUMMARY_JOB_NAME: $CI_JOB_NAME
    # `timedAsyncWrapper` appends one line per slow wait; the summary lists them in the MR comment.
    JEST_INTEGRATION_SLOW_WAITS_FILE: tmp/jest-integration-slow-waits.jsonl
    # Per-process cap: 2 workers plus the parent must stay under the 8 GB runner limit.
    # Workers peak at about 2.5 GB because `workerIdleMemoryLimit` recycles them.
    NODE_OPTIONS: --max-old-space-size=3072
  script:
    - date +%s > "${JEST_INTEGRATION_START_TIME_FILE}"
    # Capture the Jest exit code so we can re-raise it after the summary step.
    # The summary is always posted (even on test failure) because the inline
    # comment is the primary signal for reviewers; the job itself also fails
    # when tests fail, surfacing the failure in the pipeline.
    - JEST_EXIT=0; otel_span --kind test jest-integration -- yarn jest:integration --ci --passWithNoTests --forceExit --maxWorkers=2 --json --outputFile="${JEST_INTEGRATION_REPORT}" || JEST_EXIT=$?
    - !reference [.jest-integration-summary-script, script]
  artifacts:
    name: jest-integration-report
    expire_in: 7d
    when: always
    paths:
      - tmp/jest-integration-report.json
      - tmp/jest-integration-slow-waits.jsonl
  needs:
    # it's ok to wait for the repo artifact as we're waiting for the fixtures (which wait for the repo artifact) anyway
    - !reference [.frontend-test-base, needs]
    - !reference [.repo-from-artifacts, needs]
    - !reference [.with-fixtures-needs, needs]

jest-integration vue3:
  extends:
    - jest-integration
    - .vue3

# Tier-1 and tier-2: run only the integration specs related to the MR's changed files.
# Setup files load through setupFilesAfterEnv, which --findRelatedTests cannot see, so
# edits to them force the full suite through .frontend:rules:jest-integration instead.
jest-integration predictive:
  extends:
    - jest-integration
    - .frontend:rules:jest-integration:predictive
  variables:
    JEST_INTEGRATION_SUMMARY_JOB_NAME: jest-integration
  needs:
    - !reference [jest-integration, needs]
    - "detect-tests"
  script:
    - date +%s > "${JEST_INTEGRATION_START_TIME_FILE}"
    - |
      # detect-tests writes these lists without a trailing newline; `awk 1` terminates every
      # line so the last path of one file is not glued to the first path of the next.
      RELATED_FILES=$(for f in "${GLCI_PREDICTIVE_CHANGED_FILES_PATH}" "${GLCI_PREDICTIVE_MATCHING_JS_FILES_PATH}"; do [[ -f "$f" ]] && awk 1 "$f" || true; done | sort -u | tr '\n' ' ')
      if [[ -z "${RELATED_FILES// }" ]]; then
        echo "No changed files detected; will not run Jest."
        exit 0
      fi
      JEST_EXIT=0; otel_span --kind test jest-integration -- yarn jest:integration --ci --passWithNoTests --forceExit --maxWorkers=2 --json --outputFile="${JEST_INTEGRATION_REPORT}" --findRelatedTests ${RELATED_FILES} || JEST_EXIT=$?
    - !reference [.jest-integration-summary-script, script]

jest-integration vue3 predictive:
  extends:
    - jest-integration predictive
    - .vue3
  variables:
    JEST_INTEGRATION_SUMMARY_JOB_NAME: jest-integration vue3

jest-snapshot-vue3:
  extends:
    - .frontend-test-base
    - .repo-from-artifacts
    - .frontend:rules:jest-snapshot-vue3
  needs:
    # it's ok to wait for the repo artifact as we're waiting for the fixtures (which wait for the repo artifact) anyway
    - !reference [.frontend-test-base, needs]
    - !reference [.repo-from-artifacts, needs]
    - !reference [.with-fixtures-needs, needs]
  variables:
    VUE_VERSION: 3
    JEST_REPORT: jest-test-report.json
    SNAPSHOT_TEST_REPORT: jest-snapshot-test-report.json
  script:
    - |
      yarn jest:snapshots --ci --json --outputFile="${JEST_REPORT}" || echo 'Proceed to parsing test report...'
      echo $(ruby -rjson -e 'puts JSON.generate(JSON.parse(File.read(ENV["JEST_REPORT"])).dig("snapshot"))') > "${SNAPSHOT_TEST_REPORT}"

      echo " ============= snapshot test report start =============="
      cat "${SNAPSHOT_TEST_REPORT}"
      echo " ============= snapshot test report end ================"

      snapshot_test_failed=$(ruby -rjson -e 'puts JSON.parse(File.read(ENV["SNAPSHOT_TEST_REPORT"])).dig("failure")')
      if [[ "${snapshot_test_failed}" == "true" ]]
      then
        echo "You have failed snapshot tests! Exiting 1..."
        exit 1
      else
        echo 'All snapshot tests passed! Exiting 0...'
        exit 0
      fi
  artifacts:
    name: snapshot_tests
    expire_in: 31d
    when: always
    paths:
      - jest-snapshot-test-match.json
      - jest-snapshot-test-report.json

test-linters:
  extends:
    - .frontend-test-base
    - .frontend:rules:test-linters
  script:
    - yarn vitest:eslint

test-vue3migration-tooling:
  extends:
    - .frontend-test-base
    - .frontend:rules:test-vue3migration-tooling
  script:
    - yarn vitest:vue3migration

coverage-frontend:
  extends:
    - .default-retry
    - .default-utils-before_script
    - .yarn-cache
    - .repo-from-artifacts
    - .frontend:rules:coverage-frontend
  needs:
    - !reference [.repo-from-artifacts, needs]
    - job: "jest"
      optional: true
    - job: "jest-with-fixtures"
      optional: true
    - job: "jest predictive"
      optional: true
  stage: post-test
  script:
    - yarn_install_script
    - yarn node scripts/frontend/merge_coverage_frontend.js
    # Removing the individual coverage results, as we just merged them.
    - if ls coverage-frontend/jest-* > /dev/null 2>&1; then
        rm -r coverage-frontend/jest-*;
      fi
  coverage: '/^Statements\s*:\s*?(\d+(?:\.\d+)?)%/'
  artifacts:
    name: coverage-frontend
    expire_in: 31d
    paths:
      - coverage-frontend/
      - jest-reports/
      - jest-test-mapping/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-frontend/cobertura-coverage.xml

compile-storybook:
  extends:
    - .frontend-test-base
    - .storybook-yarn-cache-pull-push
    - .repo-from-artifacts
    - .frontend:rules:compile-storybook
  # In test-frontend so test-storybook can use the build artifact.
  stage: test-frontend
  needs:
    # it's ok to wait for the repo artifact as we're waiting for the fixtures (which wait for the repo artifact) anyway
    - !reference [.frontend-test-base, needs]
    - !reference [.repo-from-artifacts, needs]
    - !reference [.with-fixtures-needs, needs]
    - !reference [.with-graphql-schema-dump-needs, needs]
  artifacts:
    name: storybook
    expire_in: 31d
    when: always
    paths:
      - storybook/public
  script:
    - yarn_install_script_storybook
    - yarn run storybook:build

test-storybook:
  extends:
    - .frontend-test-base
    - .storybook-yarn-cache
    - .repo-from-artifacts
    - .frontend:rules:test-storybook
  stage: test-frontend
  needs:
    # it's ok to wait for the repo artifact as we're waiting for the fixtures (which wait for the repo artifact) anyway
    - !reference [.frontend-test-base, needs]
    - !reference [.repo-from-artifacts, needs]
    - !reference [.with-fixtures-needs, needs]
    - !reference [.with-graphql-schema-dump-needs, needs]
    # Optional: rules differ from compile-storybook, so the build step falls back when absent.
    - job: compile-storybook
      optional: true
  timeout: 60m
  artifacts:
    name: storybook-test-results
    access: developer
    expire_in: 31d
    when: always
    paths:
      - storybook/storybook-results.json
  script:
    - yarn_install_script_storybook
    - yarn --cwd ./storybook playwright install --with-deps chromium
    # Reuse compile-storybook's artifact if present, else build (pre-compiled stories avoid dev-server timeouts).
    - '[ -f storybook/public/index.html ] || yarn run storybook:build'
    # `kill $STORYBOOK_PID` only reaps the yarn wrapper, leaving its http-server child
    # orphaned and still holding the job's stdout/stderr pipe; redirect output so the
    # runner's Wait() gets EOF instead of failing "WaitDelay expired before I/O complete".
    - yarn --cwd ./storybook run serve > /dev/null 2>&1 &
    - STORYBOOK_PID=$!
    - until curl -f http://localhost:6006 >/dev/null 2>&1; do sleep 1; done  # Wait for Storybook to start
    - yarn run storybook:dev:test
    - kill $STORYBOOK_PID || true

build-assets-image:
  extends:
    - .base-image-build-buildx
    - .fast-no-clone-job
    - .production
    - .frontend:rules:compile-production-assets
  stage: prepare
  tags:
    - $GLCI_PRODUCTION_ASSETS_RUNNER_OPTIONAL
  # Keep the unconditional retry from .base-image-build-buildx instead of the
  # exit-code retry from .fast-no-clone-job, which would otherwise override it.
  retry: 2
  needs:
    - cache:assets-hash
    - job: compile-production-assets
      artifacts: true
  variables:
    GLCI_BUILD_ASSETS_IMAGE: "true"
    # The assets hash doesn't cover which bundlers go into the image, so an existing image is
    # only reused if it has this label. Change it when that changes, e.g. when a bundler is added or removed.
    GLCI_ASSETS_IMAGE_LAYOUT: "rspack"
    GLCI_ASSETS_TAG_ENV_FILE_PATH: "assets-tag-env.env"
    ARCH: linux/amd64,linux/arm64
    HEALTHCHECK_TCP_PORT: "2375"
    FILES_TO_DOWNLOAD: >
      Dockerfile.assets
      scripts/build_assets_image
  before_script:
    - !reference [".fast-no-clone-job", before_script]
    - !reference [".default-utils-before_script", before_script]
    - !reference [".buildx-setup", before_script]
  script:
    - chmod u+x scripts/build_assets_image && scripts/build_assets_image
  after_script:
    - source scripts/utils.sh
    - echo "GLCI_ASSETS_IMAGE_TAG=$(assets_image_tag)" > $GLCI_ASSETS_TAG_ENV_FILE_PATH
  artifacts:
    reports:
      dotenv: $GLCI_ASSETS_TAG_ENV_FILE_PATH

# FOSS (CE) counterpart of build-assets-image: builds the gitlab-assets-ce image
# (FOSS_ONLY selects the image name).
build-assets-image as-if-foss:
  extends:
    - build-assets-image
    - .as-if-foss
    - .qa:rules:test-on-omnibus-ce:follow-up
  needs:
    - cache:assets-hash
    - job: compile-production-assets as-if-foss
      artifacts: true
