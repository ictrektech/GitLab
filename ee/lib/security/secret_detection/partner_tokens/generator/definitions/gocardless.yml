---
token_type: "GoCardless API token"
class_name: "GocardlessClient"
partner_name: "gocardless"
endpoint: "https://api.gocardless.com/creditors"
http_method: "get"
auth_style: "bearer"
extra_headers:
  GoCardless-Version: "2015-07-06"
token_pattern: '\Alive_[a-zA-Z0-9_=-]{40}\z'
sample_token: "live_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
rate_limit_key: "partner_gocardless_api"
doc_url: "https://developer.gocardless.com/api-reference/#creditors-list-creditors"
status_map:
  "200": "active"
  "401": "inactive"
  "403": "active"
  "429": "rate_limit"
  "500": "network_error"
  "502": "network_error"
  "503": "network_error"
  "504": "network_error"
