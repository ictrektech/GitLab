---
description: An open decision in a work item decision log was resolved
internal_events: true
status: active
action: work_item_decision_resolve
identifiers:
- project
- namespace
- user
additional_properties:
  label:
    description: work item type
  property:
    description: user role
  source:
    description: |
      How the request was authenticated. `ai_workflows`: an agent (Duo
      workflows or coding agents) using an `ai_workflows`-scoped token.
      `api`: a human using any other token. `internal`: no token; for
      decisions this is the web UI. Only `ai_workflows` indicates an agent.
  work_item_id:
    description: Id of the work item that owns the decision log.
  decision_id:
    description: Id of the decision that was resolved.
  workflow_id:
    description: |
      Id of the Duo workflow run that made the request, taken from the
      `X-Gitlab-Duo-Workflow-Id` header. Omitted when the header is absent or
      not a positive integer within the bigint range. The header is
      client-supplied and is not authorized or looked up, so use it for
      analytics joins only.
  resolution_type:
    description: |
      How the decision was resolved. One of `option_pick` (one or more of the
      proposed options were selected), `write_in` (the user typed their own
      decision, which is stored as a new selected option and leaves any
      existing options unselected), `reject_all` (the decision had options and
      none was selected, so only a rationale was recorded), or `no_options`
      (the decision had no options to choose from and was resolved with a
      rationale alone).
  value:
    description: Number of options selected by the resolution (1 for `write_in`, 0 for `reject_all` and `no_options`).
product_group: work_items
product_categories:
- team_planning
milestone: '19.6'
introduced_by_url: https://gitlab.com/gitlab-org/gitlab/-/merge_requests/261013
tiers:
- premium
- ultimate
