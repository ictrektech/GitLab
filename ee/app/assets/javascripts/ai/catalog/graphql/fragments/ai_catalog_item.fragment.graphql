fragment BaseAiCatalogItem on AiCatalogItem {
  id
  createdAt
  itemType
  description
  descriptionHtml
  foundationalFlowReference
  foundational
  verificationLevel
  ... on AiCatalogAgent {
    foundational
    foundationalAgentReference
  }
  ... on AiCatalogFlow {
    foundational
    acceptsTriggerGoal @gl_introduced(version: "19.5.0")
  }
  ... on AiCatalogThirdPartyFlow {
    acceptsTriggerGoal @gl_introduced(version: "19.5.0")
  }
  name
  updatedAt
  softDeleted
  latestVersion {
    id
    versionName
    createdAt
    updatedAt
    createdBy {
      id
      name
      username
      webUrl
    }
  }
  userPermissions {
    adminAiCatalogItem
  }
  starCount
  starred
  last30DayUsageCount
  visibility
  __typename
}
