# @feature_category: workflow_catalog
#import "../fragments/ai_catalog_item.fragment.graphql"
#import "../fragments/ai_catalog_flow_version.fragment.graphql"
#import "../fragments/service_account.fragment.graphql"

query aiCatalogFlow(
  $id: AiCatalogItemID!
  $showSoftDeleted: Boolean
  $projectId: ProjectID!
  $hasProject: Boolean = false
  $groupId: GroupID!
  $hasGroup: Boolean = false
) {
  aiCatalogItem(id: $id, showSoftDeleted: $showSoftDeleted) {
    ...BaseAiCatalogItem
    isEnabledInManagedByProject
    hasDirectProjectConfigurationsInGroup(groupId: $groupId) @gl_introduced(version: "19.6.0")
    project {
      id
      name
      nameWithNamespace
      webUrl
      webPath
      rootGroup {
        id
        fullName
        fullPath
      }
      userPermissions {
        createAiCatalogItemConsumer
      }
    }
    latestVersion {
      ...BaseAiCatalogFlowVersion
    }
    configurationForProject(projectId: $projectId) @include(if: $hasProject) {
      id
      enabled
      flowTriggers {
        id
        active
        eventTypes
        filter
        description
        goals
        configPath
        aiCatalogItemConsumer {
          id
          item {
            id
            name
          }
        }
        user {
          ...BaseServiceAccount
        }
      }
      pinnedItemVersion {
        ...BaseAiCatalogFlowVersion
      }
      userPermissions {
        adminAiCatalogItemConsumer
      }
    }
    configurationForGroup(groupId: $groupId) @include(if: $hasGroup) {
      id
      enabled
      consumerKind @gl_introduced(version: "19.5.0")
      group {
        id
        duoSettingsPath
        fullName
        webPath
      }
      serviceAccount {
        ...BaseServiceAccount
      }
      pinnedItemVersion {
        ...BaseAiCatalogFlowVersion
      }
      userPermissions {
        adminAiCatalogItemConsumer
      }
    }
  }
}
