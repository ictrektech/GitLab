# @feature_category: duo_agent_platform
#import "~/graphql_shared/fragments/user.fragment.graphql"

query getDuoAgentSessionsOnPipeline($projectPath: ID!, $iid: ID!, $first: Int = 20) {
  project(fullPath: $projectPath) {
    id
    pipeline(iid: $iid) {
      id
      duoWorkflows(first: $first) {
        nodes {
          id
          title
          status
          humanStatus
          createdAt
          updatedAt
          workflowDefinition
          user {
            ...User
          }
          project {
            id
            name
            fullPath
          }
        }
      }
    }
  }
}
