# @feature_category: duo_agent_platform
#import "~/graphql_shared/fragments/user.fragment.graphql"

query getDuoAgentSessionsOnMergeRequest($projectPath: ID!, $iid: String!) {
  project(fullPath: $projectPath) {
    id
    mergeRequest(iid: $iid) {
      id
      duoWorkflows {
        nodes {
          id
          title
          status
          humanStatus
          createdAt
          updatedAt
          workflowDefinition
          user {
            ...User
          }
          project {
            id
            name
            fullPath
          }
        }
      }
    }
  }
}
