# @feature_category: duo_agent_platform

subscription workflowActivityUpdated($workflowId: AiDuoWorkflowsWorkflowID!) {
  workflowEventsUpdated(workflowId: $workflowId) {
    workflowStatus
    lastDuoMessage {
      content
      messageType
      messageSubType
      status
      toolInfo
      messageId
    }
  }
}
