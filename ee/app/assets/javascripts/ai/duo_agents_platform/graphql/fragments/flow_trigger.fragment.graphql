fragment FlowTriggerFragment on AiFlowTriggerType {
  id
  active
  description
  eventTypes
  filter
  goals
  statusOnFinish
  readyMergeRequestsOnFinish
  configUrl
  configPath
  aiCatalogItemConsumer {
    id
    item {
      id
      name
    }
  }
  user {
    id
    avatarUrl
    name
    username
    webPath
    webUrl
  }
  createdAt
  updatedAt
}
