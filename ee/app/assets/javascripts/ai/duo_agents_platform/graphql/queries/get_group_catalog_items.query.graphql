# @feature_category: ai_catalog_curation
#import "~/graphql_shared/fragments/page_info.fragment.graphql"
#import "ee/ai/catalog/graphql/fragments/ai_catalog_item.fragment.graphql"

query groupAiCatalogItems(
  $groupPath: ID!
  $groupId: GroupID!
  $itemTypes: [AiCatalogItemType!]
  $enabledBy: [AiCatalogGroupItemEnabledBy!]
  $before: String
  $after: String
  $first: Int
  $last: Int
  $search: String
  $sort: AiCatalogItemsSort
) {
  group(fullPath: $groupPath) {
    id
    aiCatalogItems(
      itemTypes: $itemTypes
      enabledBy: $enabledBy
      before: $before
      after: $after
      first: $first
      last: $last
      search: $search
      sort: $sort
    ) @gl_introduced(version: "19.6.0") {
      nodes {
        ...BaseAiCatalogItem
        project {
          id
          nameWithNamespace
        }
        configurationForGroup(groupId: $groupId) {
          id
          enabled
          consumerKind @gl_introduced(version: "19.5.0")
        }
      }
      pageInfo {
        ...PageInfo
      }
    }
  }
}
