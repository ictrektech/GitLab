# @feature_category: secrets_management

query getGroupSecretManagerStatus($fullPath: ID!) {
  secretsManager: groupSecretsManager(groupPath: $fullPath) {
    entity: group {
      id
      archived
      markedForDeletion
    }
    readOnly
    writeDenialReason @gl_introduced(version: "19.5.0")
    status
    userPermissions {
      readMetadata
      createSecrets
      updateSecrets
      deleteSecrets
    }
  }
}
