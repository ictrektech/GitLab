# @feature_category: pipeline_composition

query getCatalogResourceUsagePermissions($fullPath: ID!) {
  project(fullPath: $fullPath) {
    id
    userPermissions {
      readProject
      readProjectComponentUsages
    }
    licensedFeatureAvailability(feature: CI_COMPONENT_USAGES_IN_PROJECTS) {
      available
    }
  }
}
