# @feature_category: security_asset_inventories
query SubgroupsSecurityDetails(
  $fullPath: ID!
  $subgroupsFirst: Int
  $subgroupsAfter: String
  $subgroupsLast: Int
  $subgroupsBefore: String
) {
  group(fullPath: $fullPath) {
    id
    descendantGroups(
      archived: false
      includeParentDescendants: false
      first: $subgroupsFirst
      after: $subgroupsAfter
      last: $subgroupsLast
      before: $subgroupsBefore
    ) {
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
      nodes {
        __typename
        id
        name
        descendantGroupsCount
        projectsCount
        path
        fullPath
        avatarUrl
        webUrl
        updatedAt
        analyzerStatuses {
          success
          failure
          notConfigured
          stale
          analyzerType
          updatedAt
        }
        vulnerabilityNamespaceStatistic {
          critical
          high
          low
          info
          medium
          unknown
          updatedAt
        }
      }
    }
  }
}
