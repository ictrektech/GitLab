# @feature_category: security_policy_management

#import "./govern_policy.fragment.graphql"

query getProjectPolicyStorePolicies($fullPath: ID!, $ids: [Int!], $first: Int, $after: String) {
  project(fullPath: $fullPath) {
    id
    policyStore {
      policies(ids: $ids, first: $first, after: $after) {
        nodes {
          ...GovernPolicy
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
      triggers {
        id
        name
      }
    }
  }
}
