query RecentlyViewedItemsEE {
  currentUser {
    id
    recentlyViewedItems {
      viewedAt
      item {
        ... on WorkItem {
          id
          title
          webUrl
          workItemType {
            id
            name
            iconName
          }
        }
        ... on Issue {
          id
          title
          webUrl
        }
        ... on MergeRequest {
          id
          title
          webUrl
        }
        ... on Epic {
          id
          title
          webUrl
        }
        ... on WikiPage {
          id
          title
          webUrl
        }
      }
    }
  }
}
