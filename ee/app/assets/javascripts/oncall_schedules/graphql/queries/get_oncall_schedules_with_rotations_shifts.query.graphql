#import "../fragments/oncall_schedule_rotation_with_shifts.fragment.graphql"

query getShiftsForRotations($projectPath: ID!, $startsAt: Time!, $endsAt: Time!, $iid: ID!) {
  project(fullPath: $projectPath) {
    id
    incidentManagementOncallSchedules(iids: [$iid], first: 1) {
      nodes {
        rotations {
          nodes {
            ...OnCallRotationWithShifts
          }
        }
      }
    }
  }
}
