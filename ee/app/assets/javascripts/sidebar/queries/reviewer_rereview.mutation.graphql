# @feature_category: code_review_workflow
mutation mergeRequestRequestRereviewWithDepth(
  $projectPath: ID!
  $iid: String!
  $userId: UserID!
  $duoCodeReviewDepth: DuoCodeReviewDepth
) {
  mergeRequestReviewerRereview(
    input: {
      projectPath: $projectPath
      iid: $iid
      userId: $userId
      duoCodeReviewDepth: $duoCodeReviewDepth
    }
  ) {
    errors
  }
}
