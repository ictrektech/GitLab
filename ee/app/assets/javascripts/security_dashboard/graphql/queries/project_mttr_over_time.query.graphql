# @feature_category: vulnerability_management
query projectMttrOverTime(
  $fullPath: ID!
  $reportType: [VulnerabilityReportType!]
  $startDate: ISO8601Date!
  $endDate: ISO8601Date!
  $includeBySeverity: Boolean!
  $includeByReportType: Boolean!
  $severity: [VulnerabilitySeverity!]
  $trackedRefIds: [SecurityProjectTrackedContextID!]
) {
  namespace: project(fullPath: $fullPath) {
    id
    securityMetrics(reportType: $reportType, trackedRefIds: $trackedRefIds) {
      mttrOverTime(startDate: $startDate, endDate: $endDate, severity: $severity) {
        startDate
        endDate
        sumDays
        count
        mttr
        ... @include(if: $includeBySeverity) {
          bySeverity {
            severity
            sumDays
            count
            mttr
          }
        }
        ... @include(if: $includeByReportType) {
          byReportType {
            reportType
            sumDays
            count
            mttr
          }
        }
      }
    }
  }
}
