# @feature_category: knowledge_graph
# The expiry worker turns Orbit off when a trial ends. At most 10 groups: the orbit.access limit.
query getOrbitOwnedTrials($first: Int = 10) {
  orbit @gl_introduced(version: "19.4.0") {
    groups(topLevelOnly: true, ownedOnly: true, first: $first) {
      nodes {
        id
        orbit {
          access {
            state
          }
        }
      }
    }
  }
}
