configs:
  - name: GITLAB_STORAGE_PATH
    type: path
    title: {zh-CN: GitLab 数据目录, en: GitLab data directory}
    description:
      zh-CN: 选择 NAS 公共目录或宿主机路径。GitLab 在其 gitlab 子目录中保存仓库、上传文件、配置及密钥；PostgreSQL 数据保存在 PGV 中。不要让其他应用直接修改这些文件；迁移须完整备份并停机操作。
      en: Select a NAS public directory or host path. GitLab stores repositories, uploads, configuration, and keys in its gitlab subdirectory; PostgreSQL data remains in PGV. Keep other applications from modifying these files. Migrate with a complete backup while stopped.
    default: /data/vos_workspace/gitlab
    hints: [com.ictrek.gitlab.storage]
  - name: GITLAB_EXTERNAL_URL
    type: string
    title: {zh-CN: 外部访问地址, en: External URL}
    description:
      zh-CN: 浏览器及 Git 客户端使用的固定 VOS HTTPS 地址，须以 /app/com.ictrek.gitlab 结尾，例如 https://vos.example.com:1180/app/com.ictrek.gitlab。
      en: Stable HTTPS VOS URL used by browsers and Git clients, ending in /app/com.ictrek.gitlab, for example https://vos.example.com:1180/app/com.ictrek.gitlab.
    default: ''
  - name: GITLAB_SSH_PORT
    type: integer
    title: {zh-CN: Git SSH 端口, en: Git SSH port}
    description: {zh-CN: Git 仓库的 SSH 端口，须避开宿主机 SSH 及其他服务。, en: Git SSH port, distinct from host SSH and other services.}
    default: 2424
    minimum: 1024
    maximum: 65535
  - name: GITLAB_HTTP_PORT
    type: integer
    title: {zh-CN: 内部 HTTP 映射端口, en: Internal HTTP host port}
    description: {zh-CN: 仅绑定宿主机回环地址供诊断，用户通过 VOS 网关访问。, en: Binds host loopback for diagnostics. Users access GitLab through the VOS gateway.}
    default: 25880
    minimum: 1024
    maximum: 65535
